<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PARALIXIUM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0f;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========== ОБЩИЕ АНИМАЦИИ ========== */
        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.2); }
        }

        @keyframes shiftParticles {
            0% { background-position: 0 0; }
            100% { background-position: 200px 200px; }
        }

        @keyframes blinkHint {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes nebulaDrift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5vw, -3vw) scale(1.1); }
            100% { transform: translate(-3vw, 4vw) scale(0.95); }
        }

        @keyframes ringPulse {
            0%, 100% {
                border-color: rgba(255, 255, 255, 0.06);
                box-shadow: 0 0 20px rgba(80, 80, 160, 0.15), inset 0 0 15px rgba(80, 80, 160, 0.05);
            }
            50% {
                border-color: rgba(160, 160, 220, 0.3);
                box-shadow: 0 0 60px rgba(120, 120, 200, 0.25), inset 0 0 40px rgba(120, 120, 200, 0.1);
            }
        }

        @keyframes ringRotate1 {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes ringRotate2 {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(-360deg); }
        }
        @keyframes ringRotate3 {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.02), 0 0 40px rgba(0, 0, 0, 0.3); }
            100% { text-shadow: 0 0 60px rgba(255, 255, 255, 0.08), 0 0 120px rgba(100, 100, 255, 0.15); }
        }

        /* ========== ЗАСТАВКА 1 ========== */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0b0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .splash-background .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }

        .splash-background .glow:nth-child(1) {
            width: 600px; height: 600px; background: #2a2a5a; top: -10%; left: -10%; animation-duration: 14s;
        }
        .splash-background .glow:nth-child(2) {
            width: 500px; height: 500px; background: #3a2a4a; bottom: -10%; right: -10%; animation-duration: 16s; animation-delay: -2s;
        }
        .splash-background .glow:nth-child(3) {
            width: 400px; height: 400px; background: #1a3a5a; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-duration: 18s; animation-delay: -4s;
        }
        .splash-background .glow:nth-child(4) {
            width: 300px; height: 300px; background: #4a2a5a; bottom: 20%; left: 20%; animation-duration: 20s; animation-delay: -6s;
        }

        .splash-background .particles {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(2px 2px at 50px 160px, #ddd, transparent),
                radial-gradient(2px 2px at 90px 40px, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(2px 2px at 130px 80px, #fff, transparent),
                radial-gradient(2px 2px at 160px 30px, rgba(255, 255, 255, 0.7), transparent);
            background-size: 200px 200px;
            opacity: 0.2;
            animation: shiftParticles 20s linear infinite;
        }

        .splash-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .splash-logo {
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: 200;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #f0f0f0;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.05), 0 0 80px rgba(100, 100, 255, 0.1);
            user-select: none;
            text-align: center;
            line-height: 1.1;
        }

        .splash-sub {
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #666;
            margin-top: 0.8rem;
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        .splash-hint {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #888;
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            animation: blinkHint 1.8s ease-in-out infinite;
            font-weight: 300;
        }

        /* ========== ЗАСТАВКА 2 (орбита, кольца выровнены идеально) ========== */
        #orbit-intro {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, #0f0f18 0%, #07070c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 90;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            overflow: hidden;
        }

        #orbit-intro.visible {
            opacity: 1;
            visibility: visible;
        }

        .intro-nebula {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            pointer-events: none;
        }

        .intro-nebula .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            animation: nebulaDrift 25s ease-in-out infinite alternate;
        }

        .intro-nebula .blob:nth-child(1) {
            width: 70vw; height: 70vw; max-width: 800px; max-height: 800px;
            background: #3a2a5a; top: -20%; left: -10%; animation-duration: 30s;
        }
        .intro-nebula .blob:nth-child(2) {
            width: 60vw; height: 60vw; max-width: 600px; max-height: 600px;
            background: #1e2a4a; bottom: -15%; right: -10%; animation-duration: 28s; animation-delay: -5s;
        }
        .intro-nebula .blob:nth-child(3) {
            width: 50vw; height: 50vw; max-width: 500px; max-height: 500px;
            background: #2a1a3a; top: 40%; left: 30%; animation-duration: 22s; animation-delay: -10s;
        }
        .intro-nebula .blob:nth-child(4) {
            width: 30vw; height: 30vw; max-width: 300px; max-height: 300px;
            background: #4a3a5a; bottom: 10%; left: 10%; animation-duration: 26s; animation-delay: -15s;
        }

        .intro-particles {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                radial-gradient(1.5px 1.5px at 30px 50px, #ddd, transparent),
                radial-gradient(1.5px 1.5px at 70px 120px, rgba(255, 255, 255, 0.7), transparent),
                radial-gradient(1.5px 1.5px at 110px 30px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 150px 90px, rgba(255, 255, 255, 0.5), transparent);
            background-size: 180px 180px;
            opacity: 0.15;
            animation: shiftParticles 18s linear infinite;
            pointer-events: none;
        }

        .intro-orbit-system {
            position: relative;
            width: min(80vmin, 600px);
            height: min(80vmin, 600px);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: systemAppear 0.8s cubic-bezier(0.23, 1, 0.32, 1) both;
        }

        @keyframes systemAppear {
            0% { opacity: 0; transform: scale(0.8) rotate(-5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .intro-orbit-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(100, 100, 200, 0.1), inset 0 0 25px rgba(100, 100, 200, 0.05);
            animation: ringPulse 6s ease-in-out infinite;
        }

        .intro-orbit-ring:nth-child(1) {
            width: 100%; height: 100%;
            animation: ringPulse 8s ease-in-out infinite, ringRotate1 25s linear infinite;
        }
        .intro-orbit-ring:nth-child(2) {
            width: 75%; height: 75%;
            animation: ringPulse 10s ease-in-out infinite, ringRotate2 20s linear infinite;
        }
        .intro-orbit-ring:nth-child(3) {
            width: 50%; height: 50%;
            animation: ringPulse 7s ease-in-out infinite, ringRotate3 18s linear infinite;
        }

        .intro-core {
            position: relative;
            z-index: 5;
            text-align: center;
            pointer-events: none;
        }

        .intro-core .logo-text {
            font-size: clamp(1.8rem, 7vw, 3.5rem);
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #e8e8ff;
            text-shadow: 0 0 30px rgba(160, 160, 255, 0.2), 0 0 80px rgba(80, 80, 180, 0.15);
        }

        .intro-core .logo-line {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(180, 180, 220, 0.5), transparent);
            margin: 0.8rem auto 0;
        }

        /* ========== ГЛАВНОЕ МЕНЮ ========== */
        #main-menu {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #08080e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 80;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 1s ease;
            overflow: hidden;
        }

        #main-menu.visible {
            opacity: 1;
            visibility: visible;
        }

        .main-background {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .main-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: floatGlow 14s ease-in-out infinite alternate;
        }

        .main-glow:nth-child(1) {
            width: 550px; height: 550px; background: #2a2a5a; top: -10%; left: -5%; animation-duration: 15s;
        }
        .main-glow:nth-child(2) {
            width: 450px; height: 450px; background: #3a2a4a; bottom: -10%; right: -5%; animation-duration: 17s; animation-delay: -3s;
        }
        .main-glow:nth-child(3) {
            width: 350px; height: 350px; background: #1a3a5a; top: 60%; left: 40%; animation-duration: 19s; animation-delay: -6s;
        }

        .main-particles {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                radial-gradient(2.5px 2.5px at 25px 35px, #ddd, transparent),
                radial-gradient(2.5px 2.5px at 60px 90px, rgba(255, 255, 255, 0.7), transparent),
                radial-gradient(2.5px 2.5px at 110px 40px, #fff, transparent),
                radial-gradient(2.5px 2.5px at 140px 120px, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(2.5px 2.5px at 180px 70px, #eee, transparent);
            background-size: 200px 200px;
            opacity: 0.25;
            animation: shiftParticles 22s linear infinite;
        }

        .main-content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min-content;
            animation: fadeUp 1s cubic-bezier(0.23, 1, 0.32, 1) 0.3s both;
        }

        .main-title {
            font-size: clamp(2.5rem, 10vw, 6rem);
            font-weight: 200;
            letter-spacing: 0.35em;
            color: #e0e0ff;
            text-shadow: 0 0 40px rgba(100, 100, 255, 0.1);
            text-transform: uppercase;
            margin-bottom: 2rem;
            white-space: nowrap;
            transform: translateX(0.15em);
        }

        .main-nav {
            display: flex;
            justify-content: center;
            gap: 2.2rem;
            width: 100%;
            position: relative;
        }

        .main-nav a {
            text-decoration: none;
            color: #5a5a7a;
            font-size: 0.75rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            font-weight: 300;
            padding: 0.5rem 0.2rem;
            transition: all 0.4s ease;
            position: relative;
            white-space: nowrap;
        }

        .main-nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: #a0a0ff;
            transition: width 0.3s ease;
        }

        .main-nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(160, 160, 255, 0.5);
        }

        .main-nav a:hover::after {
            width: 100%;
        }

        .main-nav a:nth-child(2)::before {
            content: '';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 1px;
            background: rgba(180, 180, 220, 0.4);
        }

        .main-footer {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            color: #2a2a3a;
            font-size: 0.5rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.7;
            animation: fadeUp 1s ease 1s both;
            z-index: 5;
        }

        /* ========== УВЕДОМЛЕНИЕ COPIED (правый нижний угол) ========== */
        #copy-notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(15, 15, 20, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 0.5rem 1.8rem;
            color: #aaa;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        #copy-notification.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        @media (max-width: 500px) {
            .main-nav {
                gap: 1rem;
                flex-wrap: wrap;
            }
            .main-nav a { font-size: 0.6rem; letter-spacing: 0.25em; }
            .main-title { letter-spacing: 0.3em; margin-bottom: 1.5rem; transform: translateX(0.1em); }
            .main-nav a:nth-child(2)::before { top: -10px; width: 30px; }
            .main-footer { bottom: 1.5rem; font-size: 0.45rem; }
            #copy-notification {
                bottom: 1.5rem;
                right: 1.5rem;
                padding: 0.4rem 1.4rem;
                font-size: 0.55rem;
            }
        }
    </style>
</head>
<body>

    <!-- ЗАСТАВКА 1 -->
    <div id="splash-screen">
        <div class="splash-background">
            <div class="glow"></div>
            <div class="glow"></div>
            <div class="glow"></div>
            <div class="glow"></div>
            <div class="particles"></div>
        </div>
        <div class="splash-content">
            <div class="splash-logo">PARALIXIUM</div>
            <div class="splash-sub">presents</div>
        </div>
        <div class="splash-hint">CLICK</div>
    </div>

    <!-- ЗАСТАВКА 2 (орбита с идеально ровными кольцами) -->
    <div id="orbit-intro">
        <div class="intro-nebula">
            <div class="blob"></div>
            <div class="blob"></div>
            <div class="blob"></div>
            <div class="blob"></div>
        </div>
        <div class="intro-particles"></div>
        <div class="intro-orbit-system">
            <div class="intro-orbit-ring"></div>
            <div class="intro-orbit-ring"></div>
            <div class="intro-orbit-ring"></div>
            <div class="intro-core">
                <div class="logo-text">PARALIXIUM</div>
                <div class="logo-line"></div>
            </div>
        </div>
    </div>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu">
        <div class="main-background">
            <div class="main-glow"></div>
            <div class="main-glow"></div>
            <div class="main-glow"></div>
            <div class="main-particles"></div>
        </div>
        <div class="main-content">
            <div class="main-title">PARALIXIUM</div>
            <nav class="main-nav">
                <a href="https://discord.com/users/1372205860452962418" target="_blank" rel="noopener noreferrer">DISCORD</a>
                <a href="https://discord-sensor.com/members/1372205860452962418" target="_blank" rel="noopener noreferrer">DISCORD SENSOR</a>
                <a href="#" id="email-btn">EMAIL</a>
            </nav>
        </div>
        <div class="main-footer">PRLX</div>
    </div>

    <!-- Уведомление (правый нижний угол) -->
    <div id="copy-notification">COPIED</div>

    <script>
        const splash = document.getElementById('splash-screen');
        const orbitIntro = document.getElementById('orbit-intro');
        const mainMenu = document.getElementById('main-menu');
        const emailBtn = document.getElementById('email-btn');
        const copyNotification = document.getElementById('copy-notification');

        function showOrbitIntro() {
            splash.classList.add('hidden');
            orbitIntro.classList.add('visible');

            setTimeout(() => {
                orbitIntro.classList.remove('visible');
                setTimeout(() => {
                    mainMenu.classList.add('visible');
                }, 800);
            }, 3000);
        }

        splash.addEventListener('click', showOrbitIntro);
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                if (!splash.classList.contains('hidden')) {
                    showOrbitIntro();
                }
            }
        });

        // Копирование POSOSI и уведомление в правом нижнем углу
        emailBtn.addEventListener('click', (e) => {
            e.preventDefault();
            navigator.clipboard.writeText('POSOSI').then(() => {
                copyNotification.classList.add('show');
                setTimeout(() => {
                    copyNotification.classList.remove('show');
                }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = 'POSOSI';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                copyNotification.classList.add('show');
                setTimeout(() => {
                    copyNotification.classList.remove('show');
                }, 2000);
            });
        });
    </script>
</body>
</html>
