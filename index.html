<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paralixium | bio</title>
    <style>
        :root {
            --bg: #020202;
            --terminal-bg: #050505;
            --white-neon: #e0e0e0;
            --white-bright: #ffffff;
            --white-dim: #888888;
            --white-dark: #444444;
            --white-glow: rgba(255, 255, 255, 0.7);
            --white-glow-strong: rgba(255, 255, 255, 0.9);
            --text: #c0c0c0;
            --text-dim: #777777;
            --shadow-glow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 18px rgba(255, 255, 255, 0.5);
            --shadow-glow-strong: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 30px rgba(255, 255, 255, 0.7);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: 'Courier New', 'Lucida Console', 'Consolas', monospace;
            overflow: hidden;
            width: 100vw; height: 100vh;
            cursor: crosshair; /* простой крестик */
            user-select: none;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* затемняющий слой для матрицы на заставке */
        #splashOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.35);
            z-index: 1; /* над canvas, но под текстом */
            pointer-events: none;
            transition: opacity 0.5s;
        }

        /* canvas matrix rain – УСИЛЕННЫЙ СПАМ СИМВОЛАМИ */
        #matrixCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; opacity: 1;
            transition: opacity 0.5s ease;
        }
        #matrixCanvas.dimmed { opacity: 0.35; }

        /* splash screen */
        #splashTitle {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 102;
            font-family: 'Courier New', 'Lucida Console', 'Consolas', monospace;
            font-size: clamp(32px, 8vw, 72px);
            font-weight: bold; letter-spacing: 4px;
            text-align: center; transition: opacity 0.5s ease-out;
            line-height: 1.2;
            color: var(--white-neon);
            text-shadow: 0 0 15px var(--white-neon), 0 0 35px var(--white-neon), 0 0 70px #ffffff;
            animation: titleGlowWhite 2.5s ease-in-out infinite;
            cursor: pointer; /* кликабельна */
        }
        #splashTitle .white-part {
            color: #aaaaaa;
            text-shadow: 0 0 10px rgba(170,170,170,0.8), 0 0 25px rgba(170,170,170,0.5), 0 0 40px rgba(170,170,170,0.3);
            margin-left: 12px;
        }
        @keyframes titleGlowWhite {
            0%,100% { text-shadow: 0 0 15px var(--white-neon), 0 0 35px var(--white-neon), 0 0 70px #ffffff; }
            50% { text-shadow: 0 0 25px #ffffff, 0 0 55px #dddddd, 0 0 90px #cccccc; }
        }
        #clickHint {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 101; color: var(--white-neon); font-size: 13px;
            font-weight: bold; letter-spacing: 4px;
            text-shadow: var(--shadow-glow-strong);
            animation: hintPulse 2s ease-in-out infinite;
            pointer-events: none; text-align: center;
        }
        @keyframes hintPulse {
            0%,100% { opacity: 0.5; text-shadow: var(--shadow-glow); }
            50% { opacity: 1; text-shadow: var(--shadow-glow-strong); }
        }

        /* scanlines overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 200;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
            opacity: 0.6;
        }
        .scan-line {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 15px white;
            z-index: 201; pointer-events: none;
            animation: scanDown 4s linear infinite;
        }
        @keyframes scanDown { 0% { top: 0; } 100% { top: 100%; } }

        .glitch-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 202;
            background: linear-gradient(transparent 0%, rgba(255,255,255,0.03) 50%, transparent 100%);
            animation: glitchFlash 3s infinite;
            opacity: 0;
        }
        @keyframes glitchFlash {
            0%, 95%, 100% { opacity: 0; }
            96% { opacity: 0.2; }
            98% { opacity: 0.1; }
        }

        /* main screen */
        #mainScreen {
            position: relative;
            z-index: 10;
            width: 100%; height: 100vh;
            display: none;
            flex-direction: column;
            overflow-y: auto; overflow-x: hidden;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(1px);
        }
        #mainScreen.active { display: flex; }
        #mainScreen.fadingIn { animation: fadeInMain 0.7s ease-out forwards; }
        @keyframes fadeInMain { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: blur(0); } }

        .main-header {
            border-bottom: 2px solid var(--white-dark);
            padding: 18px 24px 14px;
            display: flex; align-items: center; justify-content: flex-start;
            background: rgba(0,0,0,0.85); position: sticky; top: 0; z-index: 10;
            backdrop-filter: blur(8px); box-shadow: 0 2px 15px rgba(255,255,255,0.2);
        }
        .main-header .logo {
            color: var(--white-neon); font-size: 20px; font-weight: bold;
            letter-spacing: 3px; text-shadow: var(--shadow-glow-strong);
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));
            position: relative;
            display: inline-block;
        }
        .main-header .logo .underscore { animation: blink 0.8s step-end infinite; }
        .glitch-text {
            position: relative;
            display: inline-block;
        }
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            animation: glitchText 1.5s infinite;
        }
        .glitch-text::before { color: #0ff; z-index: -1; animation-delay: 0s; }
        .glitch-text::after { color: #f0f; z-index: -2; animation-delay: 0.1s; }
        @keyframes glitchText {
            0%, 80%, 100% { opacity: 0; transform: translate(0); }
            85% { opacity: 0.8; transform: translate(-2px, 2px); }
            90% { opacity: 0.6; transform: translate(2px, -1px); }
        }
        .main-content { flex: 1; padding: 28px 24px; max-width: 900px; margin: 0 auto; width: 100%; }
        .bio-section {
            margin-bottom: 32px; border-left: 3px solid var(--white-dark);
            padding-left: 20px; transition: all 0.3s;
            background: rgba(20,20,20,0.4); box-shadow: 0 0 15px rgba(255,255,255,0.05);
            border-radius: 0 4px 4px 0;
            position: relative; overflow: hidden;
        }
        .bio-section::after {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer { 0% { left: -100%; } 100% { left: 100%; } }
        .bio-section:hover {
            border-left-color: var(--white-neon);
            box-shadow: 0 0 25px rgba(255,255,255,0.15), inset 0 0 15px rgba(255,255,255,0.03);
            background: rgba(30,30,30,0.5);
            transform: scale(1.01);
        }
        .bio-section h2 {
            color: var(--white-neon); font-size: 17px; font-weight: bold;
            letter-spacing: 2px; margin-bottom: 12px;
            text-shadow: var(--shadow-glow-strong);
            display: flex; align-items: center; gap: 8px;
            position: relative; z-index: 1;
        }
        .bio-section h2::before {
            content: '>'; color: var(--white-dim);
            text-shadow: 0 0 6px var(--white-glow); font-size: 18px;
            animation: promptPulse 1s ease-in-out infinite alternate;
        }
        @keyframes promptPulse { from { opacity: 0.5; } to { opacity: 1; } }
        .bio-section p {
            color: var(--text); font-size: 14px; font-weight: 600;
            line-height: 1.8; letter-spacing: 0.5px;
            text-shadow: 0 0 6px rgba(255,255,255,0.1);
            position: relative; z-index: 1;
        }
        .status-dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            background: var(--white-neon);
            box-shadow: 0 0 10px var(--white-glow), 0 0 22px var(--white-glow);
            margin-right: 8px; animation: statusPulse 2s ease-in-out infinite;
        }
        @keyframes statusPulse {
            0%,100% { box-shadow: 0 0 10px var(--white-glow), 0 0 22px var(--white-glow); }
            50% { box-shadow: 0 0 18px #ffffff, 0 0 40px #ffffff, 0 0 60px #dddddd; }
        }
        .neon-quote {
            font-size: 12px; font-weight: bold; color: var(--white-neon);
            text-shadow: 0 0 8px var(--white-neon), 0 0 16px var(--white-neon);
            margin-top: 16px; font-style: italic; letter-spacing: 0.8px; opacity: 0.95;
            animation: textFlicker 5s infinite;
        }
        @keyframes textFlicker {
            0%, 95%, 100% { opacity: 0.95; }
            96% { opacity: 0.6; }
            98% { opacity: 1; }
        }
        .buttons-block {
            display: flex; gap: 16px; flex-wrap: wrap;
            justify-content: flex-start; margin-top: 20px; margin-bottom: 40px;
            position: relative; z-index: 1;
        }
        .oval-btn {
            display: inline-block; padding: 14px 32px; border-radius: 50px;
            background: rgba(30,30,30,0.7); border: 1.5px solid var(--white-dark);
            color: var(--white-bright); font-family: inherit; font-size: 15px;
            font-weight: bold; letter-spacing: 1.8px; text-decoration: none;
            transition: all 0.25s ease;
            text-shadow: 0 0 6px var(--white-glow);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px); text-align: center; min-width: 160px;
            position: relative; overflow: hidden;
        }
        .oval-btn::after {
            content: '';
            position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.3s;
        }
        .oval-btn:hover {
            background: rgba(60,60,60,0.9); border-color: var(--white-neon);
            color: var(--white-neon); text-shadow: 0 0 12px var(--white-glow-strong);
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.4); transform: translateY(-2px);
        }
        .oval-btn:hover::after { opacity: 1; }

        /* particles */
        .particle {
            position: fixed; pointer-events: none;
            background: white; border-radius: 50%;
            box-shadow: 0 0 6px white;
            animation: floatUp linear infinite;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        #toast {
            position: fixed; bottom: 30px; right: 30px;
            background: rgba(20, 20, 20, 0.9); border: 1px solid var(--white-neon);
            color: var(--white-neon); padding: 12px 20px; border-radius: 30px;
            font-family: inherit; font-size: 13px; font-weight: bold;
            letter-spacing: 1px; text-shadow: 0 0 6px var(--white-glow);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            opacity: 0; transform: translateY(20px); pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease; z-index: 300;
        }
        #toast.show { opacity: 1; transform: translateY(0); }

        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

        @media (max-width: 600px) {
            #splashTitle { font-size: 28px; letter-spacing: 2px; }
            .main-header { padding: 12px 14px; }
            .main-header .logo { font-size: 16px; }
            .main-content { padding: 16px 12px; }
            .bio-section { padding-left: 14px; }
            .bio-section h2 { font-size: 15px; }
            .bio-section p { font-size: 12px; }
            #clickHint { font-size: 10px; bottom: 24px; }
            .neon-quote { font-size: 10px; }
            .buttons-block { gap: 12px; }
            .oval-btn { padding: 10px 22px; font-size: 13px; min-width: 130px; }
            #toast { right: 16px; bottom: 16px; font-size: 11px; padding: 10px 16px; }
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div id="splashOverlay"></div>
    <div class="scanlines"></div>
    <div class="scan-line"></div>
    <div class="glitch-overlay"></div>

    <!-- Splash Screen -->
    <div id="splashTitle">paralixium <span class="white-part">presents</span></div>
    <div id="clickHint">[ НАЖМИ КУДА-НИБУДЬ ЧТОБЫ ПРОДОЛЖИТЬ ]</div>

    <!-- Main Screen -->
    <div id="mainScreen">
        <header class="main-header">
            <div class="logo">
                <span class="glitch-text" data-text="paralixium">paralixium</span><span class="underscore">_</span>
            </div>
        </header>
        <div class="main-content">
            <section class="bio-section" id="info">
                <h2>info</h2>
                <p>
                    <span class="status-dot"></span> STATUS: <span style="color:#ffffff; text-shadow: 0 0 8px #ffffff;">ACTIVE</span> &nbsp;|&nbsp;
                    UPTIME: <span style="color:#cccccc; text-shadow: 0 0 8px #cccccc;">99.7%</span> &nbsp;|&nbsp;
                    LOC: <span style="color:#888888;">[REDACTED]</span>
                </p>
                <p class="neon-quote">
                    Жизнь коротка, искусство вечно, случайные обстоятельства скоропреходящи, опыт обманчив, суждения трудны.
                </p>
            </section>
            <div class="buttons-block">
                <a href="https://discord-sensor.com/members/1372205860452962418" target="_blank" class="oval-btn">Discord Sensor</a>
                <button class="oval-btn" id="copyEmailBtn">Email</button>
            </div>
        </div>
    </div>
    <div id="toast">Ссылка скопирована</div>

    <script>
        (function() {
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');

            // УСИЛЕННЫЙ МАТРИЧНЫЙ ДОЖДЬ: мельче шрифт -> больше колонок, выше скорость
            const fontSize = 10; // было 14, теперь мельче -> плотнее
            let columns = [];
            let width, height;

            // Расширенный набор символов: латиница, цифры, спецсимволы, катакана
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:",./<>?`~アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            const charsArr = chars.split('');

            function resizeMatrix() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                const columnCount = Math.floor(width / fontSize) + 1;
                columns = [];
                for (let i = 0; i < columnCount; i++) {
                    columns.push({
                        y: Math.random() * height / fontSize,
                        speed: 0.5 + Math.random() * 2.5, // выше скорость
                        charIndex: Math.floor(Math.random() * charsArr.length),
                        brightness: 0.6 + Math.random() * 0.4,
                    });
                }
            }
            window.addEventListener('resize', resizeMatrix);
            resizeMatrix();

            function drawMatrix() {
                // фон с большей непрозрачностью для более чётких следов
                ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                ctx.fillRect(0, 0, width, height);
                ctx.font = `bold ${fontSize}px "Courier New", monospace`;

                for (let i = 0; i < columns.length; i++) {
                    const col = columns[i];
                    const char = charsArr[col.charIndex];
                    const x = i * fontSize;
                    const y = col.y * fontSize;

                    // белые символы с яркостью
                    ctx.fillStyle = `rgba(255, 255, 255, ${col.brightness})`;
                    ctx.shadowColor = 'white';
                    ctx.shadowBlur = 4 * col.brightness;
                    ctx.fillText(char, x, y);

                    col.y += col.speed;
                    if (col.y * fontSize > height + fontSize * 5) {
                        col.y = -Math.random() * 30;
                        col.charIndex = Math.floor(Math.random() * charsArr.length);
                        col.speed = 0.5 + Math.random() * 2.5;
                    }
                }
                ctx.shadowBlur = 0;
                requestAnimationFrame(drawMatrix);
            }
            drawMatrix();

            // floating particles
            function createParticle() {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 3 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = Math.random() * 4 + 3 + 's';
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 7000);
            }
            setInterval(createParticle, 300); // чуть чаще частицы

            // splash screen interaction
            const splashTitle = document.getElementById('splashTitle');
            const clickHint = document.getElementById('clickHint');
            const mainScreen = document.getElementById('mainScreen');
            const splashOverlay = document.getElementById('splashOverlay');
            let splashActive = true;

            function skipSplash() {
                if (!splashActive) return;
                splashActive = false;
                splashTitle.style.opacity = '0';
                clickHint.style.opacity = '0';
                clickHint.style.pointerEvents = 'none';
                splashOverlay.style.opacity = '0';
                canvas.classList.add('dimmed');

                setTimeout(() => {
                    splashTitle.style.display = 'none';
                    clickHint.style.display = 'none';
                    splashOverlay.style.display = 'none';
                    mainScreen.classList.add('active', 'fadingIn');
                    document.body.style.overflow = 'auto';
                }, 600);
            }

            canvas.addEventListener('click', skipSplash);
            splashTitle.addEventListener('click', skipSplash);
            clickHint.addEventListener('click', skipSplash);
            document.addEventListener('keydown', function(e) {
                if (splashActive && (e.key === ' ' || e.key === 'Enter' || e.key === 'Escape')) {
                    e.preventDefault();
                    skipSplash();
                }
            });

            let autoSkipTimer = setTimeout(() => { if (splashActive) skipSplash(); }, 14000);
            document.addEventListener('mousemove', () => {
                if (splashActive) {
                    clearTimeout(autoSkipTimer);
                    autoSkipTimer = setTimeout(() => { if (splashActive) skipSplash(); }, 14000);
                }
            });

            // copy email
            const copyBtn = document.getElementById('copyEmailBtn');
            const toast = document.getElementById('toast');
            copyBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText('paralixium@info.com');
                } catch (err) {
                    const textarea = document.createElement('textarea');
                    textarea.value = 'paralixium@info.com';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                }
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });

            // glitch overlay subtle interaction
            let glitchTimer;
            document.addEventListener('mousemove', () => {
                clearTimeout(glitchTimer);
                document.querySelector('.glitch-overlay').style.opacity = '0.03';
                glitchTimer = setTimeout(() => {
                    document.querySelector('.glitch-overlay').style.opacity = '0';
                }, 150);
            });

            mainScreen.addEventListener('animationend', () => {
                mainScreen.classList.remove('fadingIn');
            });
        })();
    </script>
</body>
</html>
