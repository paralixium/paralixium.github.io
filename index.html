<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paralixium | bio</title>
    <style>
        :root {
            --bg: #020202;
            --terminal-bg: #050505;
            --white-neon: #e0e0e0;
            --white-bright: #ffffff;
            --white-dim: #888888;
            --white-dark: #444444;
            --white-glow: rgba(255, 255, 255, 0.7);
            --white-glow-strong: rgba(255, 255, 255, 0.9);
            --text: #c0c0c0;
            --text-dim: #777777;
            --shadow-glow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 18px rgba(255, 255, 255, 0.5);
            --shadow-glow-strong: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 30px rgba(255, 255, 255, 0.7);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: 'Courier New', 'Lucida Console', 'Consolas', monospace;
            overflow: hidden;
            width: 100vw; height: 100vh;
            cursor: crosshair;
            user-select: none;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        #matrixCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; background: #000;
            transition: opacity 0.6s ease-out;
        }
        #matrixCanvas.transparent { opacity: 0; pointer-events: none; }
        #splashTitle {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 102;
            font-family: 'Courier New', 'Lucida Console', 'Consolas', monospace;
            font-size: clamp(32px, 8vw, 72px);
            font-weight: bold; letter-spacing: 4px;
            text-align: center; transition: opacity 0.5s ease-out;
            line-height: 1.2; cursor: pointer;
        }
        #splashTitle .neon-white {
            color: var(--white-neon);
            text-shadow: 0 0 15px var(--white-neon), 0 0 35px var(--white-neon), 0 0 70px #ffffff;
            animation: titleGlowWhite 2.5s ease-in-out infinite;
        }
        #splashTitle .white-text {
            color: #aaaaaa;
            text-shadow: 0 0 10px rgba(170,170,170,0.8), 0 0 25px rgba(170,170,170,0.5), 0 0 40px rgba(170,170,170,0.3);
            margin-left: 12px;
        }
        @keyframes titleGlowWhite {
            0%,100% { text-shadow: 0 0 15px var(--white-neon), 0 0 35px var(--white-neon), 0 0 70px #ffffff; }
            50% { text-shadow: 0 0 25px #ffffff, 0 0 55px #dddddd, 0 0 90px #cccccc; }
        }
        #clickHint {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 101; color: var(--white-neon); font-size: 13px;
            font-weight: bold; letter-spacing: 4px;
            text-shadow: var(--shadow-glow-strong);
            animation: hintPulse 2s ease-in-out infinite;
            pointer-events: none; text-align: center;
        }
        @keyframes hintPulse {
            0%,100% { opacity: 0.5; text-shadow: var(--shadow-glow); }
            50% { opacity: 1; text-shadow: var(--shadow-glow-strong); }
        }
        #consoleScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 90; background: var(--terminal-bg);
            display: none; flex-direction: column;
            padding: 20px 24px; overflow: hidden;
            box-shadow: inset 0 0 60px rgba(255,255,255,0.03);
        }
        #consoleScreen.active { display: flex; }
        #consoleScreen.fadingOut { opacity: 0; transition: opacity 0.5s ease-out; pointer-events: none; }
        .console-header {
            text-align: center; font-size: 18px; font-weight: bold;
            letter-spacing: 3px; padding: 8px 0 14px;
            border-bottom: 1px solid var(--white-dark);
            margin-bottom: 10px; box-shadow: 0 2px 8px rgba(255,255,255,0.1);
            word-break: break-word;
        }
        .console-header .neon-white {
            color: var(--white-neon); text-shadow: var(--shadow-glow-strong);
            animation: headerGlowWhite 3s ease-in-out infinite;
        }
        .console-header .white-text {
            color: #aaaaaa; text-shadow: 0 0 5px rgba(170,170,170,0.5), 0 0 12px rgba(170,170,170,0.3);
        }
        @keyframes headerGlowWhite {
            0%,100% { text-shadow: 0 0 10px var(--white-neon), 0 0 25px var(--white-neon); }
            50% { text-shadow: 0 0 20px #ffffff, 0 0 45px #dddddd, 0 0 70px #cccccc; }
        }
        .console-body {
            flex: 1; color: var(--white-dim); font-size: 14px;
            font-weight: bold; line-height: 1.7; overflow-y: auto;
            padding: 6px 4px; letter-spacing: 0.6px;
            white-space: pre-wrap; word-break: break-all;
            text-shadow: 0 0 3px rgba(255,255,255,0.3);
        }
        .console-body .line { opacity: 0; animation: lineAppear 0.15s forwards; font-weight: bold; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
        .console-body .line.visible { opacity: 1; }
        @keyframes lineAppear { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
        .console-body .line-green { color: #cccccc; text-shadow: 0 0 10px var(--white-glow); }
        .console-body .line-amber { color: #aaaaaa; text-shadow: 0 0 8px rgba(170,170,170,0.7); }
        .console-body .line-cyan { color: #bbbbbb; text-shadow: 0 0 8px rgba(170,170,170,0.7); }
        .console-body .line-dim { color: #666666; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
        .console-body .cursor-blink {
            display: inline-block; width: 10px; height: 16px;
            background: var(--white-neon); animation: blink 0.7s step-end infinite;
            vertical-align: middle; margin-left: 3px;
            box-shadow: 0 0 10px var(--white-glow), 0 0 20px var(--white-glow);
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 200;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
            opacity: 0.6;
        }

        #mainScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 80; background: var(--bg);
            display: none; flex-direction: column;
            overflow-y: auto; overflow-x: hidden;
            box-shadow: inset 0 0 100px rgba(255,255,255,0.02);
        }
        #mainScreen.active { display: flex; }
        #mainScreen.fadingIn { animation: fadeInMain 0.7s ease-out forwards; }
        @keyframes fadeInMain { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: blur(0); } }
        .main-header {
            border-bottom: 2px solid var(--white-dark);
            padding: 18px 24px 14px;
            display: flex; align-items: center; justify-content: flex-start;
            background: rgba(0,0,0,0.85); position: sticky; top: 0; z-index: 10;
            backdrop-filter: blur(8px); box-shadow: 0 2px 15px rgba(255,255,255,0.2);
        }
        .main-header .logo {
            color: var(--white-neon); font-size: 20px; font-weight: bold;
            letter-spacing: 3px; text-shadow: var(--shadow-glow-strong);
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));
        }
        .main-header .logo .underscore { animation: blink 0.8s step-end infinite; }
        .main-content { flex: 1; padding: 28px 24px; max-width: 900px; margin: 0 auto; width: 100%; }
        .bio-section {
            margin-bottom: 32px; border-left: 3px solid var(--white-dark);
            padding-left: 20px; transition: all 0.3s;
            background: rgba(20,20,20,0.2); box-shadow: 0 0 15px rgba(255,255,255,0.05);
            border-radius: 0 4px 4px 0;
        }
        .bio-section:hover {
            border-left-color: var(--white-neon);
            box-shadow: 0 0 25px rgba(255,255,255,0.15), inset 0 0 15px rgba(255,255,255,0.03);
            background: rgba(30,30,30,0.3);
        }
        .bio-section h2 {
            color: var(--white-neon); font-size: 17px; font-weight: bold;
            letter-spacing: 2px; margin-bottom: 12px;
            text-shadow: var(--shadow-glow-strong);
            display: flex; align-items: center; gap: 8px;
        }
        .bio-section h2::before {
            content: '>'; color: var(--white-dim);
            text-shadow: 0 0 6px var(--white-glow); font-size: 18px;
        }
        .bio-section p {
            color: var(--text); font-size: 14px; font-weight: 600;
            line-height: 1.8; letter-spacing: 0.5px;
            text-shadow: 0 0 6px rgba(255,255,255,0.1);
        }
        .status-dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            background: var(--white-neon);
            box-shadow: 0 0 10px var(--white-glow), 0 0 22px var(--white-glow);
            margin-right: 8px; animation: statusPulse 2s ease-in-out infinite;
        }
        @keyframes statusPulse {
            0%,100% { box-shadow: 0 0 10px var(--white-glow), 0 0 22px var(--white-glow); }
            50% { box-shadow: 0 0 18px #ffffff, 0 0 40px #ffffff, 0 0 60px #dddddd; }
        }
        .neon-quote {
            font-size: 12px; font-weight: bold; color: var(--white-neon);
            text-shadow: 0 0 8px var(--white-neon), 0 0 16px var(--white-neon);
            margin-top: 16px; font-style: italic; letter-spacing: 0.8px; opacity: 0.95;
        }
        .buttons-block {
            display: flex; gap: 16px; flex-wrap: wrap;
            justify-content: flex-start; margin-top: 8px; margin-bottom: 40px;
        }
        .oval-btn {
            display: inline-block; padding: 14px 32px; border-radius: 50px;
            background: rgba(30,30,30,0.6); border: 1.5px solid var(--white-dark);
            color: var(--white-bright); font-family: inherit; font-size: 15px;
            font-weight: bold; letter-spacing: 1.8px; text-decoration: none;
            cursor: pointer; transition: all 0.25s ease;
            text-shadow: 0 0 6px var(--white-glow);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px); text-align: center; min-width: 160px;
        }
        .oval-btn:hover {
            background: rgba(60,60,60,0.8); border-color: var(--white-neon);
            color: var(--white-neon); text-shadow: 0 0 12px var(--white-glow-strong);
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.4); transform: translateY(-1px);
        }
        #toast {
            position: fixed; bottom: 30px; right: 30px;
            background: rgba(20, 20, 20, 0.9); border: 1px solid var(--white-neon);
            color: var(--white-neon); padding: 12px 20px; border-radius: 30px;
            font-family: inherit; font-size: 13px; font-weight: bold;
            letter-spacing: 1px; text-shadow: 0 0 6px var(--white-glow);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            opacity: 0; transform: translateY(20px); pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease; z-index: 300;
        }
        #toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 600px) {
            #splashTitle { font-size: 28px; letter-spacing: 2px; }
            .console-header { font-size: 14px; }
            .console-body { font-size: 12px; }
            .main-header { padding: 12px 14px; }
            .main-header .logo { font-size: 16px; }
            .main-content { padding: 16px 12px; }
            .bio-section { padding-left: 14px; }
            .bio-section h2 { font-size: 15px; }
            .bio-section p { font-size: 12px; }
            #clickHint { font-size: 10px; bottom: 24px; }
            .neon-quote { font-size: 10px; }
            .buttons-block { gap: 12px; }
            .oval-btn { padding: 10px 22px; font-size: 13px; min-width: 130px; }
            #toast { right: 16px; bottom: 16px; font-size: 11px; padding: 10px 16px; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <canvas id="matrixCanvas"></canvas>
    <div id="splashTitle">
        <span class="neon-white">paralixium</span> <span class="white-text">presents</span>
    </div>
    <div id="clickHint">[ НАЖМИ КУДА-НИБУДЬ ЧТОБЫ ПРОДОЛЖИТЬ ]</div>

    <div id="consoleScreen">
        <div class="console-header">
            <span class="neon-white">paralixium</span> <span class="white-text">presents</span>
        </div>
        <div class="console-body" id="consoleBody"></div>
    </div>

    <div id="mainScreen">
        <header class="main-header">
            <div class="logo">paralixium<span class="underscore">_</span></div>
        </header>
        <div class="main-content">
            <section class="bio-section" id="info">
                <h2>info</h2>
                <p>
                    <span class="status-dot"></span> STATUS: <span style="color:#ffffff; text-shadow: 0 0 8px #ffffff;">ACTIVE</span> &nbsp;|&nbsp;
                    UPTIME: <span style="color:#cccccc; text-shadow: 0 0 8px #cccccc;">99.7%</span> &nbsp;|&nbsp;
                    LOC: <span style="color:#888888;">[REDACTED]</span>
                </p>
                <p class="neon-quote">
                    Жизнь коротка, искусство вечно, случайные обстоятельства скоропреходящи, опыт обманчив, суждения трудны.
                </p>
            </section>
            <div class="buttons-block">
                <a href="https://discord-sensor.com/members/1372205860452962418" target="_blank" class="oval-btn">Discord Sensor</a>
                <button class="oval-btn" id="copyEmailBtn">Email</button>
            </div>
        </div>
    </div>
    <div id="toast">Ссылка скопирована</div>

    <script>
        (function() {
            const matrixCanvas = document.getElementById('matrixCanvas');
            const ctx = matrixCanvas.getContext('2d');
            const splashTitle = document.getElementById('splashTitle');
            const clickHint = document.getElementById('clickHint');
            const consoleScreen = document.getElementById('consoleScreen');
            const consoleBody = document.getElementById('consoleBody');
            const mainScreen = document.getElementById('mainScreen');
            const copyEmailBtn = document.getElementById('copyEmailBtn');
            const toast = document.getElementById('toast');

            let matrixActive = true, consoleActive = false, mainActive = false, animationId, columns = [];
            const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFabcdef<>{}[]|/\\!@#$%^&*()_+-=:;';
            const charsArray = chars.split('');
            const fontSize = 15;
            let canvasWidth, canvasHeight, numColumns;

            function resizeCanvas() {
                canvasWidth = window.innerWidth;
                canvasHeight = window.innerHeight;
                matrixCanvas.width = canvasWidth;
                matrixCanvas.height = canvasHeight;
                numColumns = Math.floor(canvasWidth / fontSize) + 1;
                columns = [];
                for (let i = 0; i < numColumns; i++) {
                    columns.push({
                        y: Math.random() * canvasHeight / fontSize * -1,
                        speed: 0.6 + Math.random() * 2.8,
                        charIndex: Math.floor(Math.random() * charsArray.length),
                        updateRate: Math.floor(2 + Math.random() * 8),
                        updateCounter: Math.floor(Math.random() * 8),
                        brightness: 0.4 + Math.random() * 0.6,
                        wingFactor: 0,
                    });
                }
                const center = numColumns / 2;
                columns.forEach((col, i) => {
                    const dist = Math.abs(i - center) / center;
                    col.wingFactor = 1 - dist * 0.7;
                    col.speed *= (0.7 + col.wingFactor * 0.6);
                    col.brightness = Math.min(1, col.brightness + col.wingFactor * 0.25);
                });
            }

            function drawMatrix() {
                if (!matrixActive) return;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.055)';
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                ctx.font = fontSize + 'px "Courier New", monospace';
                columns.forEach((col, i) => {
                    col.updateCounter++;
                    if (col.updateCounter >= col.updateRate) {
                        col.updateCounter = 0;
                        col.charIndex = Math.floor(Math.random() * charsArray.length);
                    }
                    const char = charsArray[col.charIndex];
                    const x = i * fontSize;
                    const y = col.y * fontSize;
                    ctx.fillStyle = `rgba(220,220,220,${0.9 + col.brightness * 0.1})`;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 8 * col.brightness;
                    ctx.fillText(char, x, y);
                    const trailLength = 6 + Math.floor(col.brightness * 8);
                    for (let t = 1; t <= trailLength; t++) {
                        const trailY = y - t * fontSize;
                        if (trailY < 0) continue;
                        const alpha = (1 - t / trailLength) * 0.7 * col.brightness;
                        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                        ctx.shadowBlur = 3 * (1 - t / trailLength) * col.brightness;
                        ctx.fillText(charsArray[Math.floor(Math.random() * charsArray.length)], x, trailY);
                    }
                    col.y += col.speed;
                    if (col.y * fontSize > canvasHeight + fontSize * trailLength) {
                        col.y = -Math.random() * 30;
                        col.speed = 0.5 + Math.random() * 3.0;
                    }
                });
                ctx.shadowBlur = 0;
            }

            function matrixLoop() {
                if (!matrixActive) return;
                drawMatrix();
                animationId = requestAnimationFrame(matrixLoop);
            }

            function setMatrixVisible(visible) {
                if (visible) {
                    matrixCanvas.classList.remove('transparent');
                    matrixCanvas.style.opacity = '1';
                    matrixCanvas.style.zIndex = '84';
                } else {
                    matrixCanvas.classList.add('transparent');
                    matrixCanvas.style.zIndex = '100';
                }
            }

            function skipMatrix() {
                if (!matrixActive) return;
                splashTitle.style.opacity = '0';
                clickHint.style.opacity = '0';
                clickHint.style.pointerEvents = 'none';
                setMatrixVisible(false);
                setTimeout(() => {
                    splashTitle.style.display = 'none';
                    clickHint.style.display = 'none';
                    startConsole();
                }, 600);
            }

            matrixCanvas.addEventListener('click', skipMatrix);
            splashTitle.addEventListener('click', skipMatrix);
            clickHint.addEventListener('click', skipMatrix);
            document.addEventListener('keydown', function(e) {
                if (matrixActive && (e.key === ' ' || e.key === 'Enter' || e.key === 'Escape')) {
                    e.preventDefault();
                    skipMatrix();
                }
            });

            let autoSkipTimer = setTimeout(() => { if (matrixActive) skipMatrix(); }, 14000);
            document.addEventListener('mousemove', () => {
                if (matrixActive) {
                    clearTimeout(autoSkipTimer);
                    autoSkipTimer = setTimeout(() => { if (matrixActive) skipMatrix(); }, 14000);
                }
            });

            const consoleLines = [
                { text: '', delay: 60 },
                { text: '[BOOT] Инициализация ядра системы...', delay: 300, cls: 'line-green' },
                { text: '[BOOT] Проверка контрольных сумм... OK', delay: 250, cls: 'line-dim' },
                { text: '[BOOT] Загрузка модулей безопасности...', delay: 200, cls: 'line-green' },
                { text: '[BOOT] Модуль шифрования: AES-256-GCM... ACTIVATED', delay: 300, cls: 'line-cyan' },
                { text: '[BOOT] Модуль обфускации трафика... ACTIVATED', delay: 250, cls: 'line-cyan' },
                { text: '[BOOT] Установка защищённого соединения...', delay: 200, cls: 'line-green' },
                { text: '[NET] Пинг шлюза: 0.3ms', delay: 180, cls: 'line-dim' },
                { text: '[NET] Маршрутизация через TOR... OK', delay: 250, cls: 'line-amber' },
                { text: '[NET] VPN-туннель установлен', delay: 200, cls: 'line-cyan' },
                { text: '[SYS] Проверка окружения...', delay: 200, cls: 'line-green' },
                { text: '[SYS] ОС: Linux 6.x | Arch: x86_64 | Shell: zsh', delay: 200, cls: 'line-dim' },
                { text: '[SYS] Доступная память: 15.6 GB / 16.0 GB', delay: 150, cls: 'line-dim' },
                { text: '[SYS] Загрузка CPU: 3%', delay: 150, cls: 'line-dim' },
                { text: '', delay: 100 },
                { text: '[LOAD] Загрузка пользовательских модулей...', delay: 300, cls: 'line-green' },
                { text: '[LOAD] [#######···········] 34%', delay: 350, cls: 'line-amber' },
                { text: '[LOAD] [##############····] 72%', delay: 400, cls: 'line-amber' },
                { text: '[LOAD] [##################] 96%', delay: 350, cls: 'line-amber' },
                { text: '[LOAD] [###################] 100% - OK', delay: 300, cls: 'line-green' },
                { text: '', delay: 100 },
                { text: '[AUTH] Проверка подписи окружения...', delay: 300, cls: 'line-green' },
                { text: '[AUTH] Хеш совпадает. Доступ подтверждён.', delay: 250, cls: 'line-cyan' },
                { text: '', delay: 150 },
                { text: '>>> ACCESS GRANTED <<<', delay: 400, cls: 'line-green' },
                { text: '', delay: 200 },
                { text: 'Загрузка интерфейса...', delay: 300, cls: 'line-dim' },
            ];

            function startConsole() {
                consoleActive = true;
                consoleScreen.classList.add('active');
                consoleBody.innerHTML = '';
                mainScreen.classList.remove('active');
                let totalDelay = 0;
                consoleLines.forEach((lineObj, idx) => {
                    totalDelay += lineObj.delay + 60;
                    setTimeout(() => {
                        if (!consoleActive) return;
                        const div = document.createElement('div');
                        div.className = 'line ' + (lineObj.cls || '');
                        div.textContent = lineObj.text || ' ';
                        consoleBody.appendChild(div);
                        requestAnimationFrame(() => div.classList.add('visible'));
                        consoleBody.scrollTop = consoleBody.scrollHeight;
                        if (idx === consoleLines.length - 1) {
                            setTimeout(() => transitionToMain(), 900);
                        }
                    }, totalDelay);
                });
                setTimeout(() => {
                    if (!consoleActive) return;
                    const cursor = document.createElement('div');
                    cursor.className = 'line';
                    cursor.innerHTML = '<span class="cursor-blink"></span>';
                    cursor.id = 'cursorLine';
                    consoleBody.appendChild(cursor);
                }, totalDelay - 200);
            }

            function transitionToMain() {
                const cursor = document.getElementById('cursorLine');
                if (cursor) cursor.remove();
                consoleScreen.classList.add('fadingOut');
                setTimeout(() => {
                    consoleActive = false;
                    consoleScreen.classList.remove('active', 'fadingOut');
                    consoleBody.innerHTML = '';
                    showMainScreen();
                }, 550);
            }

            function showMainScreen() {
                mainActive = true;
                mainScreen.classList.add('active', 'fadingIn');
                document.body.style.overflow = 'auto';
                document.body.style.cursor = 'default';
                setTimeout(() => mainScreen.classList.remove('fadingIn'), 750);
            }

            copyEmailBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText('paralixium@info.com');
                } catch (err) {
                    const textarea = document.createElement('textarea');
                    textarea.value = 'paralixium@info.com';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                }
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });

            resizeCanvas();
            matrixLoop();
            window.addEventListener('resize', () => { if (matrixActive) resizeCanvas(); });

            let keyBuffer = '';
            document.addEventListener('keydown', (e) => {
                if (!mainActive) return;
                keyBuffer += e.key.toLowerCase();
                if (keyBuffer.length > 20) keyBuffer = keyBuffer.slice(-20);
                if (keyBuffer.includes('matrix')) {
                    keyBuffer = '';
                    setMatrixVisible(true);
                    matrixActive = true;
                    matrixLoop();
                    setTimeout(() => {
                        matrixActive = false;
                        cancelAnimationFrame(animationId);
                        matrixCanvas.style.opacity = '0';
                        matrixCanvas.style.transition = 'opacity 1s ease-out';
                        setTimeout(() => {
                            matrixCanvas.classList.add('transparent');
                            matrixCanvas.style.zIndex = '100';
                        }, 1000);
                    }, 2200);
                }
            });
        })();
    </script>
</body>
</html>
