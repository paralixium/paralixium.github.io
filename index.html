<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARALIXIUM</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700;900&family=Manrope:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070b;--ink:#f5f4f8;--dim:#a8a5b4;--faint:#6c6980;--accent:#ffffff;--good:#4ade80;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;overflow-x:hidden;cursor:none;min-height:100svh}
::selection{background:#fff;color:#000}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.5;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:52vw;height:52vw;background:rgba(255,255,255,.07);top:-18%;left:-10%}
.aurora i:nth-child(2){width:40vw;height:40vw;background:rgba(120,90,255,.09);bottom:-15%;right:-8%;animation-delay:-6s}
.aurora i:nth-child(3){width:30vw;height:30vw;background:rgba(255,255,255,.05);top:45%;left:55%;animation-delay:-11s}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.15)}}
.gridlines{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 90% 70% at 50% 30%,#000 30%,transparent 100%)}
#spot{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(560px circle at var(--mx,50%) var(--my,40%),rgba(255,255,255,.06),transparent 65%)}
.cursor{position:fixed;width:26px;height:26px;border-radius:50%;z-index:9999;border:1.5px solid var(--ink);pointer-events:none;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .28s,height .28s,background .28s}
.cursor.big{width:58px;height:58px;background:rgba(255,255,255,.08)}
@media(hover:none){body{cursor:auto}.cursor{display:none}}
.wrap{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column}
nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:100;width:min(1200px,94vw);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 12px 10px 22px;border-radius:99px;background:rgba(13,13,20,.62);backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line);box-shadow:0 14px 44px rgba(0,0,0,.5);transition:.3s}
nav.scrolled{background:rgba(10,10,16,.82);box-shadow:0 18px 54px rgba(0,0,0,.65)}
.logo{font-family:'Unbounded';font-weight:900;font-size:15px;letter-spacing:.1em}
.logo em{font-style:normal;color:#fff;text-shadow:0 0 14px rgba(255,255,255,.6)}
.nav-right{display:flex;justify-content:flex-end;align-items:center;gap:14px}
.nav-status{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono';font-size:10.5px;color:var(--dim);letter-spacing:.12em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.nav-cta{font-size:12.5px;font-weight:700;padding:10px 20px;border-radius:99px;background:var(--ink);color:#0a0a0f;text-decoration:none;transition:.3s;white-space:nowrap}
.nav-cta:hover{background:#fff;color:#0a0a0f;box-shadow:0 0 26px rgba(255,255,255,.45);transform:translateY(-1px)}
@media(max-width:700px){.nav-status{display:none}}
header{flex:1;display:flex;align-items:center;padding:150px 5vw 90px;position:relative}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:70px;width:min(1200px,100%);margin:0 auto}
@media(max-width:960px){.hero-grid{grid-template-columns:1fr;gap:60px}}
.badge{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-family:'JetBrains Mono';font-size:11.5px;letter-spacing:.14em;color:var(--dim);margin-bottom:34px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);animation:pulse 2s infinite}
h1{font-family:'Unbounded';font-weight:900;font-size:clamp(30px,4.6vw,64px);line-height:1.12;letter-spacing:-.015em}
h1 .stroke{color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.85)}
h1 .grad{background:linear-gradient(100deg,#fff,#cfcfe0 50%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,255,255,.25))}
.hero-actions{margin-top:38px;display:flex;gap:14px;flex-wrap:wrap}
.btn{font-family:'Unbounded';font-weight:500;font-size:13px;padding:18px 36px;border-radius:99px;cursor:none;text-decoration:none;display:inline-flex;transition:.3s}
.btn-fill{background:var(--ink);color:#0a0a0f}
.btn-fill:hover{transform:translateY(-3px);box-shadow:0 0 36px rgba(255,255,255,.35)}
/* профиль справа — без рамки, как на референсе */
.profile{display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{width:130px;height:130px;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 14px 44px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.25),0 0 40px rgba(255,255,255,.15);animation:floaty 4s ease-in-out infinite}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes floaty{50%{transform:translateY(-8px)}}
.online{display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono';font-size:11px;color:var(--good);margin-top:20px}
.profile h3{font-family:'Unbounded';font-size:24px;font-weight:700;margin-top:12px;text-shadow:0 0 30px rgba(255,255,255,.2)}
.ds-btn{margin-top:22px;display:inline-flex;align-items:center;gap:10px;font-family:'Unbounded';font-weight:500;font-size:12.5px;padding:15px 32px;border-radius:99px;text-decoration:none;background:#fff;color:#0a0a0f;transition:.3s;box-shadow:0 10px 34px rgba(255,255,255,.2)}
.ds-btn:hover{transform:translateY(-3px);box-shadow:0 16px 44px rgba(255,255,255,.3)}
.ds-btn svg{width:17px;height:17px;stroke:#0a0a0f;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;padding:40px 5vw;border-top:1px solid var(--line);color:var(--faint);font-size:13px}
footer .logo{font-size:14px}
</style>
</head>
<body>
<div class="cursor" id="cur"></div>
<div id="spot"></div>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="gridlines"></div>
<div class="wrap">

<nav id="nav">
  <div class="logo">PARAL<em>I</em>XIUM</div>
  <div></div>
  <div class="nav-right">
    <div class="nav-status"><span class="dot"></span>ONLINE</div>
    <a class="nav-cta" href="https://discord-sensor.com/members/1372205860452962418" target="_blank" rel="noopener" data-hover>Написать →</a>
  </div>
</nav>

<header>
  <div class="hero-grid">
    <div>
      <span class="badge"><span class="dot"></span> ОТКРЫТ К ЗАКАЗАМ</span>
      <h1>The meaning of life<br><span class="stroke">is not to live long,</span><br><span class="grad">but to live truly.</span></h1>
      <div class="hero-actions">
        <a href="https://discord-sensor.com/members/1372205860452962418" target="_blank" rel="noopener" class="btn btn-fill" data-hover>Связаться со мной</a>
      </div>
    </div>

    <aside class="profile" id="contact">
      <div class="avatar"><img src="https://3xrw6bpq8e.ucarecd.net/7b530e8c-b1c8-4d76-b23c-d1edd5064207/2cbe6fbce1c60cdde200431830c9728d.jpg" alt="Paralixium"></div>
      <div class="online"><span class="dot"></span>Online</div>
      <h3>Paralixium</h3>
      <a class="ds-btn" href="https://discord-sensor.com/members/1372205860452962418" target="_blank" rel="noopener" data-hover>
        <svg viewBox="0 0 24 24"><path d="M8.5 17c-2.5 0-4.5-1.8-4.5-4s2-4 4.5-4c.4-2.3 2.5-4 5-4 2.8 0 5 2.1 5 4.7 1.9.6 3 2 3 3.8 0 2.2-1.9 3.5-4.2 3.5"/><path d="M9 21l1.5-4H8l3-5.5h4L13 15h2.5L9 21z"/></svg>
        Discord Sensor
      </a>
    </aside>
  </div>
</header>

<footer>
  <div class="logo">PARAL<em>I</em>XIUM</div>
  <span>© 2026 PARALIXIUM</span>
</footer>

</div>

<script>
const cur=document.getElementById('cur'),spot=document.getElementById('spot');
document.addEventListener('mousemove',e=>{
  cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';
  spot.style.setProperty('--mx',e.clientX+'px');spot.style.setProperty('--my',e.clientY+'px');
});
document.querySelectorAll('[data-hover],a,button').forEach(el=>{
  el.addEventListener('mouseenter',()=>cur.classList.add('big'));
  el.addEventListener('mouseleave',()=>cur.classList.remove('big'));
});
const nav=document.getElementById('nav');
addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>40),{passive:true});
</script>
</body>
</html>
